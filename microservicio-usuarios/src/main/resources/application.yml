server:
  port: 8081

spring:
  application:
    name: microservicio-usuarios
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:tienda}
    password: ${SPRING_DATASOURCE_PASSWORD:tienda123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never

# ---- Parametros de seguridad JWT ----
jwt:
  secret: ${JWT_SECRET:ClaveSecretaSuperSeguraParaLaTiendaVirtual2025CambiarEnProduccion}
  expiration: ${JWT_EXPIRATION:86400000}

# ---- Credenciales del administrador inicial (se crean al primer arranque) ----
app:
  admin:
    nombre: ${ADMIN_NOMBRE:Administrador General}
    correo: ${ADMIN_CORREO:admin@tienda.com}
    password: ${ADMIN_PASSWORD:Admin123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
