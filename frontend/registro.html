<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Registro de nuevos usuarios en la Tienda Virtual.">
    <title>Tienda Virtual - Registro</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <!-- ============================ NAVBAR ============================ -->
    <nav class="navbar navbar-expand-lg navbar-tienda sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="assets/logo.svg" alt="Logo Tienda Virtual" width="36" height="36">
                <span class="fw-bold">Tienda Virtual</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPrincipal"
                    aria-controls="navPrincipal" aria-expanded="false" aria-label="Alternar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i>Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html"><i class="bi bi-grid me-1"></i>Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">
                            <i class="bi bi-cart3 me-1"></i>Carrito
                            <span class="badge rounded-pill badge-carrito">0</span>
                        </a>
                    </li>
                    <li class="nav-item d-none" id="enlace-admin">
                        <a class="nav-link enlace-admin-nav" href="admin.html"><i class="bi bi-speedometer2 me-1"></i>Panel Admin</a>
                    </li>
                </ul>
                <ul class="navbar-nav align-items-lg-center" id="zona-usuario"></ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="seccion container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                    <div class="card tarjeta-formulario">
                        <div class="card-header text-center">
                            <i class="bi bi-person-plus fs-1"></i>
                            <h1 class="h3 mt-2">Crear una cuenta</h1>
                            <p class="small">Regístrate para realizar tus compras</p>
                        </div>
                        <div class="card-body p-4">
                            <div id="registro-error" class="alert alert-danger d-none" role="alert"></div>
                            <div id="registro-exito" class="alert alert-success d-none" role="alert"></div>

                            <form id="form-registro" novalidate>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label" for="reg-nombre">Nombre completo <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                                            <input type="text" class="form-control" id="reg-nombre" name="nombre"
                                                   placeholder="Ej. Juan Pérez" maxlength="120" required autocomplete="name">
                                        </div>
                                        <div class="invalid-feedback d-block" id="error-reg-nombre"></div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" for="reg-correo">Correo electrónico <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                            <input type="email" class="form-control" id="reg-correo" name="correo"
                                                   placeholder="usuario@correo.com" maxlength="150" required autocomplete="email">
                                        </div>
                                        <div class="invalid-feedback d-block" id="error-reg-correo"></div>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label" for="reg-password">Contraseña <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                                            <input type="password" class="form-control" id="reg-password" name="password"
                                                   placeholder="Mínimo 6 caracteres" minlength="6" maxlength="72" required autocomplete="new-password">
                                        </div>
                                        <div class="form-text">Debe tener entre 6 y 72 caracteres.</div>
                                        <div class="invalid-feedback d-block" id="error-reg-password"></div>
                                    </div>
                                    <div class="col-12 col-md-7">
                                        <label class="form-label" for="reg-direccion">Dirección</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-geo-alt text-muted"></i></span>
                                            <input type="text" class="form-control" id="reg-direccion" name="direccion"
                                                   placeholder="Av. Principal 123, Lima" maxlength="200" autocomplete="street-address">
                                        </div>
                                    </div>
                                    <div class="col-12 col-md-5">
                                        <label class="form-label" for="reg-telefono">Teléfono</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-white"><i class="bi bi-telephone text-muted"></i></span>
                                            <input type="tel" class="form-control" id="reg-telefono" name="telefono"
                                                   placeholder="999999999" maxlength="20" autocomplete="tel">
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 py-2 mt-4" id="btn-registro">
                                    <i class="bi bi-person-check me-1"></i>Registrarme
                                </button>
                            </form>

                            <p class="text-center mt-3 mb-0 small">
                                ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- ============================ FOOTER ============================ -->
    <footer class="footer-tienda py-4">
        <div class="container">
            <p class="text-center small mb-0">© <span id="anio-actual"></span> Tienda Virtual · Proyecto académico de microservicios.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
