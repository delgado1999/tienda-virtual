server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Archivos estaticos: cualquier ruta inexistente cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso hacia el API Gateway.
    # Se usa el resolver interno de Docker (127.0.0.11) junto con una
    # variable para que la resolucion DNS sea dinamica al arrancar.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_api http://api-gateway:8080;
        proxy_pass $upstream_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
